version: 2
name: rotation_evaluation_contract

inputs:
  client_case_ref:
    required: true
    contract: CLIENT-CASE-001
    description: >-
      Reference to the explicit agricultural/client case containing target location,
      goals, constraints, user-declared facts, unknowns, assumptions, and priorities.

  evidence:
    required: true
    description: >-
      Traceable validated/curated observations and derived indicators qualified for
      the intended decision role.

  soil_context:
    required: conditional
    description: >-
      Validated measured, representative, or explicitly modeled soil context when
      required by the candidate/rules. Missing required soil evidence must block or
      limit the evaluation rather than be invented.

  crops:
    required: true
    description: Governed crop knowledge referenced by candidate rotations.

  rotations:
    required: true
    minimum_count: 2
    preferred_count: 3
    description: Rotation alternatives to compare, including the current strategy when known.

  decision_rules:
    required: true
    description: Active validated rules eligible to affect evaluation.

prerequisite_gate:
  allowed_status:
    - READY
    - READY_WITH_LIMITATIONS
    - INSUFFICIENT_EVIDENCE
  rule: >-
    The deterministic engine establishes prerequisite status. A language model or
    user-interface layer cannot promote an evidence-insufficient case to READY.

outputs:
  per_rotation:
    required_fields:
      - rotation_id
      - evaluation_status
      - supporting_factors
      - risks
      - trade_offs
      - evidence_refs
      - applied_rule_refs
      - assumptions
      - unknowns
      - limitations
      - explanation_trace
    optional_fields:
      - comparative_result
      - score
      - score_components

  comparison:
    fields:
      - ranking_or_preference_when_justified
      - major_trade_offs
      - decision_sensitive_priorities
      - missing_information
      - comparison_limitations

scoring:
  required: false
  rule: >-
    Prefer transparent qualitative or categorical evaluation when a numeric score
    would create false precision. If a score is used, formula, factors, ranges,
    weights, evidence basis, priority effects, and interpretation must be explicit.

invariants:
  - every_material_result_must_be_traceable_to_evidence_rule_or_explicit_assumption
  - invalid_for_decision_role_observations_must_not_feed_active_evaluation
  - numeric_scores_must_not_imply_precision_beyond_the_underlying_evidence
  - client_priorities_may_change_trade_off_weighting_but_not_rewrite_observations
  - inactive_candidate_or_shadow_rules_must_not_affect_active_results
  - explanations_must_not_invent_reasons_outside_the_structured_decision_trace
  - spatial_and_temporal_support_of_evidence_must_be_preserved
  - insufficient_evidence_must_remain_visible
  - llm_output_must_not_override_deterministic_evaluation_status
