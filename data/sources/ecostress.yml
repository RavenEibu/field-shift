id: nasa_ecostress_eco_l3t_jet
provider: NASA LP DAAC
product: ECOSTRESS Tiled Evapotranspiration Instantaneous and Daytime L3 Global 70
  m
short_name: ECO_L3T_JET
version: 2
metadata_status: pending_verification
observation_data_status: not_acquired
acquisition_status: deferred
project_priority: mvp_plus
last_verified: 2026-10-30
authoritative_url: https://cmr.earthdata.nasa.gov/search/site/collections/directory/LPCLOUD/gov.nasa.eosdis
access:
  authentication: earthdata_login_for_download
  primary_format: Cloud_Optimized_GeoTIFF
role_in_field_shift:
- evapotranspiration_context
- plant_water_use_context
- field_scale_water_stress_evidence
spatial_scope:
  nominal_resolution: 70_m
  effective_decision_scale: field_to_landscape_context
  parcel_level: conditional
  note: Higher nominal resolution does not remove the need for quality masks, geolocation
    checks, and uncertainty handling.
temporal_scope:
  acquisition_pattern: ISS_based_irregular_overpass
quality_requirements:
- use_cloud_and_water_masks
- inspect_ETinstUncertainty_or_equivalent_uncertainty_layer
- check_scene_geolocation_quality_for_field_comparisons
- check_known_quality_periods_and_obstruction_notices
- inspect_for_coarse_resolution_artifacts_before_quantitative_use
known_quality_notes:
- Some higher-level products can contain coarse 500m-to-1km artifacts when ancillary
  STARS inputs are dominated by VIIRS; these generally correspond to larger uncertainty.
- ECOSTRESS guidance recommends restricting geolocation-sensitive evaluations to scenes
  with suitable geolocation quality.
- Version 3 Level-2 products were released in 2026, but authoritative CMR still lists
  ECO_L3T_JET as Version 2; do not infer a Version-3 L3T JET product from the Level-2
  release.
strengths:
- substantially_finer_spatial_resolution_than_regional_products
- directly_related_to_evapotranspiration_and_water_use
incremental_mvp_value:
  level: medium_high
  disposition: deferred_until_core_loop_validated
  reason: 'Adds field-scale ET/water-stress evidence that POWER and SMAP do not provide,
    but irregular sampling and QA complexity increase implementation risk.

    '
limitations:
- irregular_temporal_sampling
- cloud_and_quality_constraints
- geolocation_quality_must_be_checked
- coarse_resolution_artifacts_can_appear_in_derived_products
metadata_note:
  description: A third-party challenge mapping reviewed on 2026-10-30 listed ECO_L3T_JET
    as V003, while authoritative NASA CMR currently lists ECO_L3T_JET V002. Field
    Shift records V002 until NASA authoritative metadata changes.
  third_party_reference: https://spacedata.swapniltamse.com/challenges/field-shift-adapting-farms/
intended_decision_use:
  description: Add higher-resolution evapotranspiration evidence after the core climate
    and soil-moisture decision loop is working.
  direct_recommendation_authority: false
validation_semantics:
  metadata_status: pending_verification
  metadata_verified: false
  observation_data_validated: false
  note: Deferred source (MVP+). Detailed verification deferred to post-MVP phase.
suitability:
  tier: deferred_mvp_plus
  evaluation_document: docs/data-sources/evaluation.md
  evaluation_framework: multi_attribute_qualitative
