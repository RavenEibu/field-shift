- regional_soil_context
source_characteristics:
  data_type: machine_learning_spatial_prediction
  nominal_resolution: 250_m
  uncertainty:
    quantiles:
    - q05
    - q50
    - q95
    explicit_prediction_interval: true
  note: ISRIC SoilGrids provides global 250m machine-learning predictions. It is an
    unverified fallback when local measured soil profiles (SisINTA) are unavailable,
