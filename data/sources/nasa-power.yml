id: nasa_power_meteorology
provider: NASA POWER
underlying_authority:
  organization: NASA Global Modeling and Assimilation Office
  products:
    historical: MERRA-2
    near_real_time: GEOS-IT
metadata_status: verified
observation_data_status: pending_pipeline_validation
acquisition_status: acquired_frozen_baseline
project_priority: core
last_reconciled: 2026-11-02
authoritative_urls:
  methodology: https://power.larc.nasa.gov/docs/methodology/data/sources_meteorology/
  services: https://power.larc.nasa.gov/docs/services/
role_in_field_shift:
  - regional_climate_context
  - historical_baseline
  - drought_and_heat_context
native_characteristics:
  meteorology_grid: 0.5_deg_lat_x_0.625_deg_lon
  solar_grid: 1.0_deg_lat_x_1.0_deg_lon
  temporal_start: '1981-01-01'
  near_real_time_latency: approximately_2_days
  mixed_resolution_note: >-
    POWER parameters are derived from distinct native grids. Values are spatial averages and must
    never be simplified to a uniform point-weather interpretation or assumed to share one native grid.
optional_high_resolution_catalog_pathways:
  imerg_precipitation:
    nominal_resolution: 0.1_deg_lat_x_0.1_deg_lon
    source: NASA GPM IMERG
    used_in_baseline_acquisition: false
    status: NOT_REQUESTED
    note: >-
      IMERG is a separate optional pathway. Standard acquired PRECTOTCORR in the MVP baseline is
      MERRA-2-scale precipitation and must not be described as IMERG 0.1-degree precipitation.
  smap_soil_moisture:
    source: NASA GSFC / NSIDC SMAP L4 SPL4SMGP v8
    used_in_power_baseline_acquisition: false
    historical_adapter_attempt:
      result: all_fill_sentinel_minus_999
      disposition: HISTORICAL_ACCESS_PATH_EVIDENCE_ONLY
    current_field_shift_smap_path: NASA_AppEEARS_direct_product_access
    note: >-
      The failed POWER adapter attempt does not define current SMAP availability. SMAP is governed
      independently by data/sources/smap-l4.yml and its successful AppEEARS baseline acquisition.
parameter_lineage_ref: data/sources/power-parameter-lineage.yml
validation_notes:
  - POWER publishes comparisons of MERRA-2 meteorological parameters against surface observations.
  - Standard acquired precipitation PRECTOTCORR is MERRA-2 observationally corrected precipitation on a regional grid, not parcel rainfall.
  - Daily precipitation requires more caution than temperature in local point comparisons.
  - Near-real-time values may later be replaced by climate-quality values; temporal/freshness semantics must be preserved.
spatial_scope:
  effective_decision_scale: regional_climate_context
  parcel_level: false
  note: Grid values are spatial averages and must not be represented as field-station measurements.
freshness:
  mutable_tail: true
  climate_trend_rule: end_analysis_at_least_2_months_behind_nrt_when_stability_is_required
  reason: near_real_time_data_can_be_replaced
transformability:
  formats:
    - json
    - csv
  api_access: true
  reproducibility: high
limitations:
  - coarse_for_individual_fields
  - precipitation_requires_more_caution_than_temperature
  - mixed_effective_resolution_across_parameter_families
intended_decision_use:
  description: >-
    Establish long-term climate and recent regional meteorological context used by downstream
    environmental and water-stress indicators after source-specific validation.
  direct_recommendation_authority: false
validation_semantics:
  metadata_verified: true
  observation_data_validated: false
  validation_phase: V1_TO_V7_PENDING_WITH_PRIOR_ACQUISITION_EVIDENCE_REUSABLE
  required_checks:
    - exact_acquired_request_and_parameter_identity
    - actual_temporal_bounds_and_record_count
    - schema_and_duplicate_detection
    - missing_and_fill_semantics
    - units
    - physical_plausibility
    - per_parameter_native_spatial_support
    - freshness_and_latency
    - defensible_local_comparison_contract
  serving_contract_candidates:
    - SERVE-TABULAR-001
  note: Provider specifications and successful acquisition do not establish scientific/agronomic validity.
suitability:
  tier: core_mvp
  current_operational_inclusion: false
  blocking_reason: source_specific_validation_pending
  evaluation_document: docs/data-sources/evaluation.md
  evaluation_framework: multi_attribute_qualitative
