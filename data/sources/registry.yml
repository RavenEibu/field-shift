version: 4
last_reviewed: 2026-11-02
policy:
  source_of_truth: data/sources/
  evaluation_presentation: docs/data-sources/evaluation.md
  rating_framework: multi_attribute_qualitative
  rule: >-
    Structured factual source metadata under data/sources/ is authoritative for product/source
    identities, intended roles, acquisition state, and validation requirements. Acquisition and
    validation are separate dimensions. Source fitness is role-specific and cannot be overridden
    by heuristic scores or fluent AI explanations.

status_model:
  acquisition:
    - acquired_frozen
    - acquired_context_material
    - official_document_acquired
    - not_required_for_frozen_mvp_extract
    - deferred
  observation_validation:
    - pending_pipeline_validation
    - pending_source_role_qualification
    - climatological_context_pending_extract_qualification
    - not_started
  rule: SOURCE_ACQUIRED != OBSERVATION_VALIDATED

core_or_candidate:
  - id: nasa_power_meteorology
    file: nasa-power.yml
    role: regional_climate_context
    metadata_status: verified
    acquisition_state: frozen_extract_acquired
    validation_state: pending_pipeline_validation

  - id: nasa_smap_l4_spl4smgp_v8
    file: smap-l4.yml
    role: regional_soil_moisture_context
    target_role: core
    metadata_status: verified
    acquisition_state: frozen_extract_acquired_via_appeears
    validation_state: pending_pipeline_validation

  - id: inta_mapa_nacional_cultivos
    file: inta-mnc.yml
    role: observed_crop_history_context
    metadata_status: partially_verified
    acquisition_state: frozen_extract_acquired
    validation_state: pending_pipeline_validation

  - id: inta_sisinta
    file: inta-sisinta.yml
    role: local_soil_characterization
    metadata_status: partially_verified
    acquisition_state: packaged_snapshot_acquired
    validation_state: pending_pipeline_validation

  - id: fao_crop_water_knowledge
    file: fao-crop-water.yml
    role: crop_water_knowledge
    metadata_status: partially_verified
    acquisition_state: reference_material_available
    validation_state: authority_and_applicability_must_remain_explicit

local_validation_and_context:
  - id: rem_san_luis
    file: rem-san-luis.yml
    role: local_station_validation_context
    metadata_status: partially_verified
    acquisition_state: frozen_historical_responses_acquired
    validation_state: pending_pipeline_validation

  - id: smn_climatological_normals_1991_2020
    file: smn-climatology.yml
    role: official_climatological_context
    metadata_status: verified_for_acquired_document
    acquisition_state: official_document_acquired
    validation_state: context_role_and_table_extract_qualification_pending

  - id: inta_agrometeorological_network
    file: inta-agromet.yml
    role: supporting_agrometeorological_context
    metadata_status: partially_verified
    acquisition_state: context_material_acquired
    validation_state: exact_resource_and_incremental_role_pending

fallback:
  - id: isric_soilgrids_250m
    file: soilgrids.yml
    role: modeled_soil_fallback
    hard_gate_disposition: fallback_context_only
    metadata_status: partially_verified
    acquisition_state: not_required_for_frozen_mvp_extract
    validation_state: not_started

supporting_or_deferred:
  - id: nasa_hls
    file: hls.yml
    disposition: deferred_unless_field_scale_vegetation_gap_is_demonstrated
    metadata_status: pending_verification
  - id: nasa_gpm_imerg_final_daily
    file: gpm-imerg.yml
    disposition: deferred_unless_precipitation_gap_identified
    metadata_status: pending_verification
  - id: nasa_ecostress_eco_l3t_jet
    file: ecostress.yml
    disposition: deferred_unless_ET_or_plant_stress_gap_identified
    metadata_status: pending_verification
  - id: nasa_grace_grace_fo_mascon_cri
    file: grace-grace-fo.yml
    disposition: deferred_macro_context_only
    metadata_status: pending_verification

superseded_for_mvp_primary_use:
  - id: nasa_smap_spl3smp_e
    file: smap.yml
    reason: >-
      Remains an evaluated NASA source, but SMAP L4 is preferred for the MVP because root-zone
      modeled soil-moisture context has greater direct relevance to the current water-stress question.
    metadata_status: pending_verification

invariants:
  - SOURCE_SELECTED_FOR_MVP != SOURCE_ACQUIRED
  - SOURCE_ACQUIRED != OBSERVATION_VALIDATED
  - OBSERVATION_VALIDATED != USED_BY_DECISION_ENGINE
  - REGIONAL_CONTEXT != PARCEL_TRUTH
  - HISTORICAL_FAILED_ACCESS_PATH != CURRENT_SOURCE_AVAILABILITY
