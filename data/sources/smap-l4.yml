role_in_field_shift:
  - regional_surface_soil_moisture_context
  - regional_root_zone_soil_moisture_context
  - relative_drought_or_moisture_context_when_variable_semantics_are_validated

native_characteristics:
  nominal_resolution: approximately_9_km
  temporal_resolution: 3_hourly_native_product
  temporal_start: 2015-03-31
  extraction_temporal_semantics: pending_V1_V5_validation

spatial_scope:
  effective_decision_scale: regional_context
  parcel_level: false
  note: Do not present a 9 km modeled/assimilated value or point extraction as an exact parcel measurement.

limitations:
  - coarse_for_individual_fields
  - root_zone_is_model_assimilated_not_direct_root_measurement
  - record_begins_in_2015
  - frozen_or_snow_covered_conditions_may_reduce_skill
  - AppEEARS_extraction_structure_fill_and_variable_semantics_require_validation

intended_decision_use:
  description: >-
    Provide regional modeled surface/root-zone soil-moisture context and potentially relative
    moisture/drought evidence. Plant-available water or crop water-stress interpretation requires
    additional validated soil and crop context such as field capacity, wilting point, rooting depth,
    and crop characteristics.
  direct_recommendation_authority: false

validation_semantics:
  metadata_verified: true
  observation_data_validated: false
  validation_phase: V1_TO_V7_PENDING
  required_checks:
    - actual_AppEEARS_schema_and_rows
    - actual_temporal_coverage
    - duplicate_detection
    - fill_and_nodata_semantics
    - sm_rootzone_pctl_usability
    - units_and_variable_meaning
    - product_version_identity
    - native_scale_and_point_extraction_relationship
    - representativeness_for_prototype_use
  serving_contract_candidates:
    - SERVE-TABULAR-001_for_qualified_point_extractions
    - SERVE-RASTER-001_if_native_grid_artifacts_are_later_required
  note: Acquisition and provider metadata do not establish scientific validity or decision fitness.

suitability:
  tier: core_mvp
  mvp_target_inclusion: true
  current_operational_inclusion: false
  blocking_reason: source_specific_validation_pending
  evaluation_document: docs/data-sources/evaluation.md
  evaluation_framework: multi_attribute_qualitative
