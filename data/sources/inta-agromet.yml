id: inta_agrometeorological_network
provider: INTA Argentina
product_family: INTA agrometeorological information and SIGA-related material
metadata_status: partially_verified
observation_data_status: pending_source_role_qualification
acquisition_status: acquired_context_material
project_priority: supporting_validation
last_reconciled: 2026-11-02
authoritative_urls:
  national_overview: https://www.argentina.gob.ar/inta/informacion-agroclimatica
  eea_san_luis: https://www.argentina.gob.ar/inta/cr-lapampa-sanluis/eea-sanluis

role_in_field_shift:
  - local_agrometeorological_context_candidate
  - potential_cross_source_validation_support
  - institutional_context_for_villa_mercedes

frozen_extract:
  cutoff: 2026-11-01
  acquisition_state: context_material_present
  exact_station_series_claimed: false
  note: >-
    Field Shift acquired INTA/SIGA-related material, but this record does not claim that a complete,
    validated local station time series has been established. Exact files, variables, periods, and
    incremental role must be qualified during source validation.

source_characteristics:
  data_type: institutional_agrometeorological_information_and_potential_station_resources
  spatial_support: source_resource_dependent
  temporal_support: source_resource_dependent

selection_requirements:
  - preserve_station_or_resource_identity
  - preserve_coordinates_and_elevation_when_station_based
  - preserve_variable_units_and_time_basis
  - inspect_missingness_and_station_changes
  - align_comparison_period_and_spatial_support_before_cross_source_validation
  - avoid_redundant_use_when_REM_or_other_local_evidence_already_fills_the_role

limitations:
  - exact_acquired_resource_semantics_pending
  - source_may_overlap_with_other_local_networks
  - point_station_and_gridded_products_have_different_spatial_support

intended_decision_use:
  description: >-
    Supporting local/agrometeorological evidence when a concrete acquired resource adds decision or
    validation value beyond REM, SMN climatology, or other already-qualified sources.
  direct_recommendation_authority: false

validation_semantics:
  observation_data_validated: false
  validation_phase: exact_resource_and_role_qualification_pending
  required_checks:
    - inventory_acquired_SIGA_material
    - identify_resource_or_station_identity
    - variables_units_and_time_basis
    - temporal_and_spatial_coverage
    - missingness_and_quality_semantics
    - redundancy_or_incremental_value_against_REM_and_other_sources
  serving_contract_candidates:
    - SERVE-TABULAR-001_if_a_station_or_time_series_resource_is_qualified
    - SERVE-VECTOR-001_if_station_or_resource_locations_are_material

suitability:
  tier: supporting_validation_source
  current_operational_inclusion: false
  blocking_reason: exact_acquired_resource_and_incremental_role_pending
  evaluation_document: docs/data-sources/evaluation.md
  evaluation_framework: multi_attribute_qualitative
