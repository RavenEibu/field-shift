id: inta_mapa_nacional_cultivos
provider: INTA Argentina
product: Mapa Nacional de Cultivos
metadata_status: partially_verified
observation_data_status: pending_pipeline_validation
acquisition_status: acquired_frozen_baseline
project_priority: core
last_reconciled: 2026-11-02
authoritative_urls:
  overview: https://www.argentina.gob.ar/node/486863
  latest_dataset_reference: https://zenodo.org/records/17652712

role_in_field_shift:
  - observed_crop_classification_context
  - crop_sequence_history_context
  - current_rotation_baseline_candidate

frozen_extract:
  cutoff: 2026-11-01
  file_count: 20
  campaigns_observed:
    first: 2018_2019
    latest: 2024_2025
  integrity_status: verified_by_frozen_extract_manifest
  note: Acquisition facts do not establish class semantics, campaign completeness, or field-level fitness.

coverage:
  geography: main_agricultural_areas_of_argentina
  cadence: annual_campaign
  exact_campaign_and_spatial_coverage: pending_validation

method:
  - supervised_classification
  - sentinel_2_imagery
  - landsat_imagery
  - field_survey_samples

spatial_scope:
  nominal_resolution_candidate: 30_m
  validation_required: true
  effective_decision_scale: field_context_with_classification_uncertainty
  note: >-
    A classified remote-sensing pixel is evidence of a crop class under the product methodology;
    it is not a farmer planting/management record or a legal property boundary.

quality_requirements:
  - preserve_campaign
  - preserve_map_version_or_record
  - preserve_class_legend
  - preserve_accuracy_assessment_when_available
  - preserve_native_spatial_support

limitations:
  - classification_error_possible
  - annual_campaign_product_not_continuous_field_log
  - field_boundaries_and_management_events_are_not_directly_observed
  - exact_class_semantics_and_coverage_require_V1_V7_validation

intended_decision_use:
  description: >-
    Provide evidence-backed crop-class/history context for the prototype area so candidate rotations
    can be compared against observed remote-sensing history when the relevant campaigns/classes are validated.
  direct_recommendation_authority: false

validation_semantics:
  metadata_verified: partial
  observation_data_validated: false
  validation_phase: V1_TO_V7_PENDING
  required_checks:
    - artifact_identity_and_campaign_mapping
    - raster_or_vector_structure
    - CRS_extent_and_native_resolution
    - class_legend_and_nodata_semantics
    - coverage_for_prototype_area
    - accuracy_or_quality_metadata_when_available
    - distinction_between_classified_crop_history_and_management_record
  serving_contract_candidates:
    - SERVE-RASTER-001_if_native_classification_grid_is_preserved
    - SERVE-VECTOR-001_for_explicit_derived_crop_polygons_when_justified
    - SERVE-TABULAR-001_for_derived_field_or_point_history_with_lineage

suitability:
  tier: core_supporting
  current_operational_inclusion: false
  blocking_reason: source_specific_validation_pending
  evaluation_document: docs/data-sources/evaluation.md
  evaluation_framework: multi_attribute_qualitative
