id: fao_crop_water_knowledge
provider: FAO
references:
  fao56:
    title: Crop Evapotranspiration - Guidelines for Computing Crop Water Requirements
    role: evapotranspiration_and_crop_water_reference
    authoritative_url: https://www.fao.org/4/x0490e/x0490e00.htm
  aquacrop:
    title: AquaCrop input requirements and crop-water modeling framework
    role: conceptual_input_model
    authoritative_url: https://www.fao.org/aquacrop/overview/input-requirements/
validation_status: validated_reference_knowledge
project_priority: core_knowledge
last_verified: 2026-10-30

role_in_field_shift:
  - crop_water_knowledge
  - crop_growth_stage_context
  - soil_water_balance_concepts
  - parameter_schema_reference

knowledge_scope:
  relevant_concepts:
    - reference_evapotranspiration
    - crop_coefficients
    - crop_evapotranspiration
    - growth_stages
    - rooting_depth
    - soil_water_stress
    - available_soil_water
    - management_inputs

hard_gate: >
  FAO reference knowledge is not a field observation. Crop parameters must remain cultivar/region aware
  where the reference requires local calibration or validated characteristics.

fitness_rating:
  methodology: context/source-fitness.md
  score_100: 90
  class: A
  qualification: reference_knowledge_not_observation_dataset

limitations:
  - generic_parameters_may_require_local_adjustment
  - not_a_crop_rotation_compatibility_database
  - not_a_substitute_for_local_agronomic_validation

intended_decision_use:
  description: Provide authoritative concepts and validated parameter references for translating climate, soil, and crop characteristics into water-related decision factors.
  direct_recommendation_authority: false
