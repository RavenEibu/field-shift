id: nasa_power_meteorology
provider: NASA POWER
underlying_authority:
  organization: NASA Global Modeling and Assimilation Office
  products:
    historical: MERRA-2
    near_real_time: GEOS-IT
validation_status: validated
project_priority: core
last_verified: 2026-10-30

authoritative_urls:
  methodology: https://power.larc.nasa.gov/docs/methodology/data/sources_meteorology/
  services: https://power.larc.nasa.gov/docs/services/

role_in_field_shift:
  - regional_climate_context
  - historical_baseline
  - drought_and_heat_context

native_characteristics:
  meteorology_grid: 0.5_deg_lat_x_0.625_deg_lon
  temporal_start: 1981-01-01
  near_real_time_latency: approximately_2_days

validation_notes:
  - POWER publishes comparisons of MERRA-2 meteorological parameters against NOAA NCEI surface observations.
  - Daily precipitation has materially weaker point-level agreement than daily temperature in the published validation summaries.
  - Near-real-time GEOS-IT values are later replaced by improved MERRA-2 climate-quality values.

spatial_scope:
  effective_decision_scale: regional_climate_context
  parcel_level: false
  note: Grid values are spatial averages and must not be represented as field-station measurements.

freshness:
  mutable_tail: true
  climate_trend_rule: end_analysis_at_least_2_months_behind_nrt
  reason: near_real_time_data_can_be_replaced

transformability:
  formats: [json, csv]
  api_access: true
  reproducibility: high

fitness_rating:
  methodology: context/source-fitness.md
  score_100: 90.5
  class: A

limitations:
  - coarse_for_individual_fields
  - precipitation_requires_more_caution_than_temperature
  - mixed_effective_resolution_if_combined_with_high_resolution_power_parameters

intended_decision_use:
  description: Establish long-term climate and recent regional meteorological context used by downstream water-stress indicators.
  direct_recommendation_authority: false
