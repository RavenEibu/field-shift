version: 2
last_reviewed: 2026-10-30

policy:
  source_of_truth: context/source-fitness.md
  rating_registry: context/source-fitness.yml
  rule: >
    Source fitness is role-specific. A high score cannot override spatial-scale,
    uncertainty, product-identity, or evidence-strength gates.

core_or_candidate:
  - id: nasa_power_meteorology
    file: nasa-power.yml
    role: regional_climate_context
    score_100: 90.5
    class: A
  - id: nasa_smap_l4_spl4smgp_v8
    file: smap-l4.yml
    role: regional_soil_moisture_context
    score_100: 94.5
    class: A
  - id: inta_mapa_nacional_cultivos
    file: inta-mnc.yml
    role: observed_crop_history
    score_100: 91.5
    class: A
  - id: inta_sisinta
    file: inta-sisinta.yml
    role: local_soil_characterization
    score_100: 90.5
    class: A
    qualification: source_system_only
  - id: fao_crop_water_knowledge
    file: fao-crop-water.yml
    role: crop_water_knowledge
    score_100: 94.0
    class: A

fallback:
  - id: isric_soilgrids_250m
    file: soilgrids.yml
    role: modeled_soil_fallback
    score_100: 71.0
    class: B
    hard_gate_disposition: fallback_context_only

supporting_or_deferred:
  - id: nasa_ecostress
    file: ecostress.yml
  - id: nasa_gpm_imerg
    file: gpm-imerg.yml
  - id: nasa_hls
    file: hls.yml
  - id: nasa_grace_grace_fo
    file: grace-grace-fo.yml

superseded_for_mvp_primary_use:
  - id: nasa_smap_spl3smp_e
    file: smap.yml
    reason: >
      Remains a valid source definition, but SMAP L4 is preferred for the MVP because
      it adds root-zone moisture context. Preserve L3 as an evaluated alternative.
