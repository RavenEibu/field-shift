id: nasa_gpm_imerg_final_daily
provider: NASA GPM / PPS / GES DISC
product: GPM IMERG Final Precipitation L3 1 day 0.1 degree x 0.1 degree
short_name: GPM_3IMERGDF
version: 07
retrospective_revision: V07B
doi: 10.5067/GPM/IMERGDF/DAY/07
validation_status: validated
project_priority: supporting
last_verified: 2026-10-30

authoritative_urls:
  directory: https://gpm.nasa.gov/data/directory
  faq: https://gpm.nasa.gov/resources/faq
access:
  authentication: earthdata_login_for_download
  formats:
    - NetCDF
    - HDF5
    - GeoTIFF

role_in_field_shift:
  - precipitation_history
  - precipitation_cross_check
  - event_and_season_context

spatial_scope:
  nominal_resolution: 0.1_degree_x_0.1_degree
  approximate_linear_scale: about_10_km
  effective_decision_scale: regional_context
  parcel_level: false

temporal_scope:
  native_imerg_resolution: 30_minutes
  selected_mvp_supporting_resolution: daily
  series_start: 1998
  final_run_latency: approximately_3.5_months

quality_requirements:
  - preserve_IMERG_run_type
  - preserve_version_and_retrospective_revision
  - prefer_Final_Run_for_research_historical_analysis
  - do_not_mix_Early_Late_Final_without_explicit_reason
  - preserve_precipitation_units_and_accumulation_period

strengths:
  - global_precipitation_estimates
  - long_TRMM_GPM_historical_record
  - high_temporal_resolution
  - Final_Run_incorporates_additional_calibration_and_gauge_information

fitness_rating:
  methodology: context/source-fitness.md
  dimensions: {authority_and_provenance: 5, scientific_validation_and_uncertainty: 4.5, decision_relevance: 4, spatial_and_temporal_fitness: 3.5, transformability_and_access: 4.5, operational_stability: 4.5}
  score_100: 87.0
  class: A

incremental_mvp_value:
  level: medium
  disposition: deferred_unless_precipitation_gap_identified
  reason: >
    IMERG is a strong precipitation product, but POWER already supplies precipitation for the initial climate context. Use IMERG when precipitation-specific temporal detail, cross-checking, or event analysis materially changes the decision.

limitations:
  - final_run_not_near_real_time
  - 10km_scale_is_not_parcel_rainfall
  - satellite_precipitation_uncertainty_varies_by_region_and_event
  - redundant_with_POWER_if_no_specific_precipitation_question_exists

intended_decision_use:
  description: Complement or cross-check precipitation evidence, especially for historical or event-focused analysis.
  direct_recommendation_authority: false
