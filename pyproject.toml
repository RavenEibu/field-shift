[project]
name = "field-shift"
version = "0.1.0"
description = "Evidence-driven agricultural decision support using NASA Earth observation data and local agronomic context."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb",
  "geopandas",
  "h5py",
  "jupyterlab",
  "numpy",
  "pandas",
  "pyarrow",
  "pyproj",
  "rasterio",
  "requests",
  "shapely",
  "xarray",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
