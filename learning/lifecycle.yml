version: 1
name: governed_learning_lifecycle

states:
  candidate:
    active_effect: false
    description: Proposed new knowledge or rule change awaiting evaluation.

  shadow:
    active_effect: false
    description: Candidate is evaluated against evidence without changing production behavior.

  validated:
    active_effect: false
    description: Candidate passed defined validation criteria and awaits explicit promotion.

  promoted:
    active_effect: true
    description: Candidate became active operational knowledge or decision logic.

  rejected:
    active_effect: false
    description: Candidate was evaluated and not accepted.

transitions:
  - from: candidate
    to: shadow
    requires:
      - explicit_test_plan
      - traceable_evidence_refs

  - from: shadow
    to: validated
    requires:
      - evaluation_results
      - regression_review
      - limitations_recorded

  - from: validated
    to: promoted
    requires:
      - explicit_human_approval
      - affected_context_identified
      - provenance_complete

  - from: candidate
    to: rejected
    requires:
      - rejection_reason

  - from: shadow
    to: rejected
    requires:
      - rejection_reason
      - evaluation_results

  - from: validated
    to: rejected
    requires:
      - rejection_reason

invariants:
  - candidate_and_shadow_states_must_not_change_active_decisions
  - ai_confidence_is_not_independent_evidence
  - promoted_knowledge_must_be_traceable_to_validation
  - recommendation_affecting_changes_require_human_approval
  - rejected_candidates_should_remain_traceable_when_useful
